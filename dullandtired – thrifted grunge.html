header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:var(--ink);color:var(--paper);border-bottom:6px solid var(--blood)}
.logo{font-family:'Permanent Marker',cursive;font-size:1.5rem;transform:rotate(-2deg);margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.cartbtn{background:var(--mustard);color:#16130f;border:2px solid #16130f;padding:.4rem .9rem;box-shadow:3px 3px 0 var(--blood)}
:focus-visible{outline:3px dashed var(--blood);outline-offset:3px}
.hero{padding:3.5rem 1.2rem 3rem;max-width:960px;margin:0 auto}
.hero h2{font-family:'Permanent Marker',cursive;font-size:clamp(2.8rem,11vw,6.5rem);line-height:.95;margin:0 0 1rem;transform:rotate(-1.5deg);text-shadow:4px 4px 0 var(--blood)}
.hero p{max-width:46ch;font-size:1.1rem;background:var(--mustard);color:#16130f;display:inline-block;padding:.6rem .9rem;transform:rotate(.8deg);border:2px solid #16130f}
.tape{height:26px;background:repeating-linear-gradient(-45deg,var(--mustard) 0 18px,#16130f 18px 36px)}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;max-width:960px;margin:2rem auto 1rem;padding:0 1.2rem}
.filters button{background:transparent;border:2px solid var(--ink);padding:.3rem .8rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.6rem;max-width:960px;margin:0 auto;padding:1rem 1.2rem 3rem}
.item{background:var(--card);border:2px solid var(--ink);padding:.7rem;box-shadow:6px 6px 0 #000}
.item:nth-child(odd){transform:rotate(-.8deg)}.item:nth-child(even){transform:rotate(.7deg)}
.swatch{height:190px;border:2px solid var(--ink);position:relative;display:grid;place-items:center;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 14px,transparent 14px 40px),repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 14px,transparent 14px 40px),var(--c)}
.swatch span{font-family:'Permanent Marker',cursive;background:var(--paper);color:var(--ink);padding:.1rem .6rem;transform:rotate(-4deg);border:2px solid var(--ink)}
.item h3{margin:.7rem 0 .1rem;font-size:1.05rem}
.meta{margin:0;font-size:.85rem;opacity:.8}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem}
.price{font-family:'Permanent Marker',cursive;font-size:1.4rem;color:var(--blood)}
.add{background:var(--ink);color:var(--paper);border:0;padding:.4rem .8rem}
.add:disabled{background:transparent;color:var(--ink);text-decoration:line-through;cursor:default}
.about{background:var(--ink);color:var(--paper);padding:2.5rem 1.2rem;text-align:center}
.about p{max-width:52ch;margin:.5rem auto}
footer{text-align:center;padding:1.5rem;font-size:.85rem}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:6px solid var(--blood);padding:calc(1rem + env(safe-area-inset-top,0px)) 1.2rem calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;z-index:20}
#drawer.open{transform:none}
#lines{flex:1;overflow-y:auto;margin:1rem 0;padding:0;list-style:none}
#lines li{display:flex;justify-content:space-between;gap:.5rem;padding:.5rem 0;border-bottom:2px dashed var(--ink)}
.rm{background:none;border:0;color:var(--blood);text-decoration:underline}
.close{align-self:flex-end;background:none;border:2px solid var(--ink);padding:.1rem .6rem}
.buy{background:var(--blood);color:#f3ead6;border:2px solid var(--ink);padding:.7rem;font-size:1.05rem;box-shadow:4px 4px 0 var(--ink)}
.empty{opacity:.7}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
</style>
</head>
<body>
<header>
  <h1 class="logo">dullandtired</h1>
  <button class="cartbtn" id="open" aria-label="Open cart">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <p>1/1 garments. Inventory is very limited.</p>
</section>
<div class="tape" aria-hidden="true"></div>

<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
<main class="grid" id="grid"></main>

<section class="about">
  <p>Everything is pre-loved and photographed honestly. The devil is in the details.</p>
</section>
<footer>Designed in a room, somewhere.</footer>

<aside id="drawer" aria-label="Cart">
  <button class="close" id="close">Close</button>
  <h2 class="logo" style="margin-top:.5rem">Your stash</h2>
  <ul id="lines"></ul>
  <p><strong>Total: <span id="total">$0</span></strong></p>
  <button class="buy" id="buy">Send my order</button>
</aside>

<script>
// ===== EDIT ME =====
const SHOP_EMAIL = "you@example.com"; // orders arrive here
const ITEMS = [
  {id:10, name:"Faded trucker cap", cat:"Hats", size:"One size", cond:"Sweat-stained, adjustable", price:16, color:"#6e2a22"},
  {id:2, name:"Faded band tee", cat:"Tees", size:"M", cond:"Cracked print", price:22, color:"#2b2b2b"},
  {id:6, name:"Oversized cardigan", cat:"Sweaters", size:"XL", cond:"Small hole at cuff", price:30, color:"#6b5a44"},
  {id:3, name:"Ripped baggy jeans", cat:"Jeans", size:"32x32", cond:"Real rips", price:35, color:"#3f5568"},
  {id:11, name:"Beat-up combat boots", cat:"Shoes", size:"10", cond:"Scuffed, broken in", price:40, color:"#2a1f1a"}
];
// ===================
let cart = [], filter = "All";
const $ = id => document.getElementById(id);
const money = n => "$" + n;

function renderFilters(){
  const ORDER = ["All", "Hats", "Tees", "Sweaters", "Jeans", "Shoes"]; // filter button order
  const cats = ["All", ...new Set(ITEMS.map(i => i.cat))].filter(c => ["Jackets", "Flannels"].includes(c) === false)
    .sort((a, b) => ((ORDER.indexOf(a) + 1) || 99) - ((ORDER.indexOf(b) + 1) || 99));
  $("filters").innerHTML = cats.map(c => `<button aria-pressed="${c===filter}" data-c="${c}">${c}</button>`).join("");
}
function renderGrid(){
  $("grid").innerHTML = ITEMS.filter(i => filter==="All" || i.cat===filter).map(i => {
    const inCart = cart.includes(i.id);
    return `<article class="item">
      <div class="swatch" style="--c:${i.color}"><span>${i.cat}</span></div>
      <h3>${i.name}</h3>
      <p class="meta">Size ${i.size}. ${i.cond}.</p>
      <div class="row"><span class="price">${money(i.price)}</span>
      <button class="add" data-id="${i.id}" ${inCart?"disabled":""}>${inCart?"In cart":"Add to cart"}</button></div>
    </article>`;
  }).join("");
}
function renderCart(){
  const items = cart.map(id => ITEMS.find(i => i.id===id));
  $("count").textContent = items.length;
  $("lines").innerHTML = items.length
    ? items.map(i => `<li><span>${i.name} (${i.size})</span><span>${money(i.price)} <button class="rm" data-id="${i.id}">remove</button></span></li>`).join("")
    : '<li class="empty">Nothing here yet. Go dig through the pile.</li>';
  $("total").textContent = money(items.reduce((s,i) => s+i.price, 0));
  $("buy").disabled = !items.length;
}
function refresh(){ renderGrid(); renderCart(); }

$("filters").onclick = e => { const c = e.target.dataset.c; if(c){ filter = c; renderFilters(); renderGrid(); } };
$("grid").onclick = e => { const id = +e.target.dataset.id; if(id && !cart.includes(id)){ cart.push(id); refresh(); } };
$("lines").onclick = e => { const id = +e.target.dataset.id; if(id){ cart = cart.filter(x => x!==id); refresh(); } };
$("open").onclick = () => $("drawer").classList.add("open");
$("close").onclick = () => $("drawer").classList.remove("open");
$("buy").onclick = () => {
  const items = cart.map(id => ITEMS.find(i => i.id===id));
  const body = items.map(i => `- ${i.name} (${i.size}) ${money(i.price)}`).join("\n")
    + `\n\nTotal: ${$("total").textContent}\n\nMy name and shipping address:\n`;
  location.href = `mailto:${SHOP_EMAIL}?subject=${encodeURIComponent("New order")}&body=${encodeURIComponent(body)}`;
};
renderFilters(); refresh();
</script>
</body>
</html>
